<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قاموس مصوّر</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#6b7280;--accent:#4f46e5;--line:#e5e7eb;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--accent:#818cf8;--line:#374151}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--accent:#818cf8;--line:#374151}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);color-scheme:light dark}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 14px 8px;z-index:5}
h1{font-size:20px;margin:0 0 10px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.cats button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:999px;font-size:14px;cursor:pointer}
.cats button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:6px 14px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center}
.emo{font-size:48px;line-height:1.2}
.en{font-weight:700;font-size:18px;margin-top:6px;direction:ltr}
.ar{font-size:18px;color:var(--accent);margin:4px 0 10px}
.btns{display:flex;gap:6px;justify-content:center}
.btns button{border:none;background:var(--bg);color:var(--text);padding:7px 10px;border-radius:10px;font-size:13px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px}
.count{color:var(--muted);font-size:13px;padding:4px 2px}
#modeBtn{border:1px solid var(--accent);background:none;color:var(--accent);padding:6px 14px;border-radius:999px;font-size:14px;cursor:pointer;margin:0 0 10px}
.quiz{grid-column:1/-1;max-width:420px;margin:0 auto;width:100%}
.quiz input{margin:14px 0 4px;text-align:left;direction:ltr}
.quiz .btns button{padding:9px 12px}
</style>
</head>
<body>
<header>
  <h1>📖 قاموس مصوّر</h1>
  <button id="modeBtn">✍️ تدريب الكتابة</button>
  <input id="q" type="search" placeholder="ابحث بالعربي أو الإنجليزي..." autocomplete="off">
  <div class="cats" id="cats"></div>
  <div class="count" id="count"></div>
</header>
<main id="list"></main>
<script src="dictionary.js"></script>
</body>
</html>
